name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'  # Trigger only when backend files change

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Backend with Maven
        working-directory: backend/dockapi-main-server  # Updated path
        run: mvn clean package -DskipTests

      - name: Upload Artifact to S3
        run: |
          aws s3 cp backend/dockapi-main-server/target/*.jar s3://your-bucket-name/dockapi-app.jar

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USER }}/dockapi/backend/dockapi-main-server  # Corrected path
            sudo systemctl stop dockapi-backend
            rm -f app.jar
            aws s3 cp s3://your-bucket-name/dockapi-app.jar app.jar  # Download the JAR from S3
            sudo systemctl start dockapi-backend
