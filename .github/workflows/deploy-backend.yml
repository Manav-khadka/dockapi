name: Deploy Backend to AWS EC2 via Docker

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'  # Trigger only when backend files change

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        working-directory: backend/dockapi-main-server  # Updated path
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/dockapi-main-server:${{ github.sha }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/dockapi-main-server:${{ github.sha }}
          docker tag ${{ secrets.DOCKER_USERNAME }}/dockapi-main-server:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/dockapi-main-server:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/dockapi-main-server:latest

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/dockapi-main-server:latest
            docker stop dockapi-backend || true
            docker rm dockapi-backend || true
            docker run -d --name dockapi-backend -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/dockapi-main-server:latest
